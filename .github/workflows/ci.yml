name: RideDesk CI/CD Pipeline

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ══════════════════════════════════════════════════════════
  # 1. Backend Automation Test Suite (Laravel 11 & PHP 8.3)
  # ══════════════════════════════════════════════════════════
  backend-tests:
    name: Backend API & Feature Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend-laravel

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup PHP Runtime
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, xml, ctype, iconv, intl, pdo_sqlite, sqlite3, curl, zip, bcmath
          coverage: none

      - name: Cache Composer Dependencies
        uses: actions/cache@v4
        with:
          path: backend-laravel/vendor
          key: ${{ runner.os }}-composer-${{ hashFiles('backend-laravel/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      - name: Install Composer Dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Configure Environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Verify Route & Config Integrity
        run: |
          php artisan route:list
          php artisan config:cache
          php artisan config:clear

      - name: Run Automated Test Cases (PHPUnit)
        run: php artisan test --colors=always

  # ══════════════════════════════════════════════════════════
  # 2. Frontend Automation Build & Bundler Suite (React & Vite)
  # ══════════════════════════════════════════════════════════
  frontend-tests:
    name: Frontend Compilation & Assets Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend-react

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js Runtime
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend-react/package.json

      - name: Install NPM Dependencies
        run: npm install

      - name: Verify Production Vite Bundle Compilation
        run: npm run build

  # ══════════════════════════════════════════════════════════
  # 3. Production Deployment Gatekeeper
  # ══════════════════════════════════════════════════════════
  deployment-gate:
    name: Deployment Gatekeeper
    needs: [backend-tests, frontend-tests]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    steps:
      - name: Confirm Pipeline Success
        run: |
          echo "========================================================"
          echo "All backend automated test cases passed (100% OK)."
          echo "Frontend Vite production compilation verified."
          echo "Application is verified and safe for production release."
          echo "========================================================"

